<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - FastBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .producto-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .producto-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .producto-img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">Registro y Catálogo de Productos</h1>

        <!-- Formulario -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-4">
                <form id="formProducto" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="col-md-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" step="0.01" class="form-control" id="precio" required>
                        </div>
                        <div class="col-md-3">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="stock" required>
                        </div>
                        <div class="col-md-6">
                            <label for="categoriaNombre" class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="categoriaNombre" required>
                        </div>
                        <div class="col-md-6">
                            <label for="categoriaDescripcion" class="form-label">Descripción de Categoría</label>
                            <input type="text" class="form-control" id="categoriaDescripcion">
                        </div>
                        <div class="col-md-12">
                            <label for="imagen" class="form-label">Imagen del Producto</label>
                            <input type="file" class="form-control" id="imagen" accept="image/*">
                            <div class="mt-2 text-center">
                                <img id="preview" src="" alt="Vista previa" style="max-height: 150px; display: none;" class="img-thumbnail">
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100">Registrar Producto</button>
                        </div>
                    </div>
                </form>
                <div id="resultado" class="alert mt-4" style="display: none;"></div>
            </div>
        </div>

        <!-- Barra de Búsqueda y Filtros -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Catálogo</h2>
            <div class="d-flex gap-2">
                <input type="text" id="inputBusqueda" class="form-control" placeholder="Buscar producto...">
                <button id="btnRecargar" class="btn btn-outline-secondary">Recargar</button>
            </div>
        </div>

        <!-- Tarjetas de Productos -->
        <div id="listaProductos" class="row g-4"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://backend-gupal-alastapas.onrender.com/api';
        let productosRegistrados = [];

        // Previsualización de la imagen
        document.getElementById("imagen").addEventListener("change", (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById("preview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });

        // Registrar Producto
        document.getElementById("formProducto").addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultadoDiv = document.getElementById("resultado");
            resultadoDiv.style.display = "none";

            const formData = new FormData();
            formData.append("nombre", document.getElementById("nombre").value.trim());
            formData.append("precio", document.getElementById("precio").value);
            formData.append("stock", document.getElementById("stock").value);
            formData.append("categoria", JSON.stringify({
                nombre: document.getElementById("categoriaNombre").value.trim(),
                descripcion: document.getElementById("categoriaDescripcion").value.trim()
            }));

            const imagenInput = document.getElementById('imagen');
            if (imagenInput.files.length > 0) {
                formData.append('image', imagenInput.files[0]);
            }

            try {
                const respuesta = await fetch(`${BACKEND_URL}/registrarproducto`, {
                    method: "POST",
                    body: formData
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    resultadoDiv.className = "alert alert-success mt-4";
                    resultadoDiv.innerHTML = (data.mensaje || "Producto registrado con éxito") + (
                        data.producto && data.producto.image
                            ? `<br><img src="${data.producto.image}" style="max-width:100%;margin-top:10px;border-radius:8px;">`
                            : ""
                    );

                    document.getElementById("formProducto").reset();
                    document.getElementById("preview").style.display = "none";
                    cargarProductos();
                } else {
                    resultadoDiv.className = "alert alert-danger mt-4";
                    resultadoDiv.textContent = data.mensaje || "Error al registrar el producto";
                }

                resultadoDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                resultadoDiv.className = "alert alert-danger mt-4";
                resultadoDiv.textContent = "Error de conexión con el servidor.";
                resultadoDiv.style.display = "block";
            }
        });

        function escaparHtml(valor) {
            return String(valor ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function normalizarTexto(valor) {
            return String(valor ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLocaleLowerCase('es');
        }

        function mostrarProductos(termino = '') {
            const contenedor = document.getElementById('listaProductos');
            const consulta = normalizarTexto(termino);

            const productosFiltrados = productosRegistrados.filter((producto) => {
                const categoria = producto.categoria_id || {};
                const textoProducto = [
                    producto.nombre,
                    producto.precio,
                    producto.stock,
                    categoria.nombre,
                    categoria.descripcion
                ].map(normalizarTexto).join(' ');

                return textoProducto.includes(consulta);
            });

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info text-center">
                            ${consulta
                                ? 'No se encontraron productos que coincidan con la búsqueda.'
                                : 'Aún no hay productos registrados.'}
                        </div>
                    </div>`;
                return;
            }

            contenedor.innerHTML = productosFiltrados.map((producto) => {
                const categoria = producto.categoria_id || {};
                const imagen = producto.image || 'https://via.placeholder.com/600x400?text=Producto';

                return `
                    <div class="col-12 col-sm-6 col-xl-4">
                        <div class="card producto-card h-100 overflow-hidden">
                            <img src="${escaparHtml(imagen)}" class="card-img-top producto-img" alt="${escaparHtml(producto.nombre)}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title mb-2">${escaparHtml(producto.nombre)}</h5>
                                <p class="card-text mb-1 text-muted">
                                    ${escaparHtml(categoria.nombre || 'Sin categoría')}
                                </p>
                                <p class="card-text mb-1">
                                    <small class="text-muted">Precio: C$ ${escaparHtml(producto.precio)} · Stock: ${escaparHtml(producto.stock)}</small>
                                </p>
                                ${categoria.descripcion
                                    ? `<p class="card-text mt-auto mb-0"><small class="text-muted">${escaparHtml(categoria.descripcion)}</small></p>`
                                    : ''}
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function cargarProductos() {
            const contenedor = document.getElementById('listaProductos');
            contenedor.innerHTML = '<div class="col-12 text-center text-muted">Cargando productos...</div>';

            try {
                const respuesta = await fetch(`${BACKEND_URL}/producto`);
                const productos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(productos.mensaje || 'No se pudieron obtener los productos');
                }
                if (!Array.isArray(productos)) {
                    throw new Error('La respuesta del servidor no contiene una lista de productos');
                }

                productosRegistrados = productos;
                mostrarProductos(document.getElementById('inputBusqueda').value);
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">Error al cargar los productos. Intenta nuevamente.</div>
                    </div>`;
            }
        }

        document.getElementById('inputBusqueda').addEventListener('input', (evento) => {
            mostrarProductos(evento.target.value);
        });
        document.getElementById('btnRecargar').addEventListener('click', cargarProductos);

        // Inicialización
        cargarProductos();
    </script>
</body>
</html>
